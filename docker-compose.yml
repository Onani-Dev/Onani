# Single compose file for both dev and prod
# Usage:
#   podman-compose --profile dev up -d --build       (dev: local builds, hot reload)
#   podman-compose --profile dev-ml up -d --build    (dev + DeepDanbooru deps)
#   podman-compose --profile prod up -d              (prod: GHCR pre-built images)
#   podman-compose --profile prod-ml up -d           (prod: GHCR ML-enabled images)

x-env: &dev-env
  FLASK_APP: run
  FLASK_ENV: development
  FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:-dev}
  FLASK_SQLALCHEMY_ECHO: "True"
  TESTING: "True"
  # No default: run ./generate_env.sh (or set it in .env yourself) before
  # starting any profile — dev included, now that postgres:5432 is bound to
  # 127.0.0.1 instead of the weak-default/publicly-reachable combo this used
  # to be.
  DB_PASSWORD: ${DB_PASSWORD:?}
  # No default here either: onani/__init__.py (security H6) generates and
  # logs a random admin password on first start when this is unset. A
  # ":-admin" default here would silently override that and put the app
  # back to the admin/admin state H6 exists to prevent.
  DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-}

x-env-ml: &dev-env-ml
  DEEPDANBOORU_ENABLED: "true"
  DEEPDANBOORU_PROJECT_PATH: /models/deepdanbooru

x-env-prod-ml: &prod-env-ml
  DEEPDANBOORU_ENABLED: "true"
  DEEPDANBOORU_PROJECT_PATH: /models/deepdanbooru

x-env-prod: &prod-env
  FLASK_APP: run
  FLASK_SECRET_KEY: ${FLASK_SECRET_KEY}
  DB_PASSWORD: ${DB_PASSWORD:?}

x-db-deps: &db-deps
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy

services:
  # ──────────────────────────────────────────────────────────
  # DEVELOPMENT: local builds with hot reload
  # ──────────────────────────────────────────────────────────

  flask-dev:
    profiles: [ "dev" ]
    hostname: flask
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        INSTALL_ML: "false"
    restart: unless-stopped
    ports:
      - 5000:5000
    environment: *dev-env
    depends_on: *db-deps
    volumes:
      - ${IMAGES_HOST_DIR:-images}:/images
      - ${AVATARS_HOST_DIR:-avatars}:/avatars
      - ./logs:/logs
      - ./:/onani

  flask-dev-ml:
    profiles: [ "dev-ml" ]
    hostname: flask
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        INSTALL_ML: "true"
    restart: unless-stopped
    ports:
      - 5000:5000
    environment:
      <<: [*dev-env, *dev-env-ml]
    depends_on: *db-deps
    volumes:
      - ${IMAGES_HOST_DIR:-images}:/images
      - ${AVATARS_HOST_DIR:-avatars}:/avatars
      - /mnt/bignas/vault/XXX/gallery-dl:/mnt/bignas/vault/XXX/gallery-dl:ro
      - ./logs:/logs
      - ./:/onani
      - ${DEEPDANBOORU_MODEL_HOST_DIR:-./models/deepdanbooru}:/models/deepdanbooru:ro

  frontend-dev:
    profiles: [ "dev", "dev-ml" ]
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - 5173:5173
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

  celery-dev:
    profiles: [ "dev" ]
    build:
      context: .
      dockerfile: ./celery/dockerfile.dev
      args:
        INSTALL_ML: "false"
    restart: unless-stopped
    environment: *dev-env
    depends_on: *db-deps
    volumes:
      - ${IMAGES_HOST_DIR:-images}:/images
      - ${AVATARS_HOST_DIR:-avatars}:/avatars
      - /mnt/bignas/vault/XXX/gallery-dl:/mnt/bignas/vault/XXX/gallery-dl:ro
      - ./logs:/logs
      - ./:/onani

  celery-dev-ml:
    profiles: [ "dev-ml" ]
    build:
      context: .
      dockerfile: ./celery/dockerfile.dev
      args:
        INSTALL_ML: "true"
    restart: unless-stopped
    environment:
      <<: [*dev-env, *dev-env-ml]
    depends_on: *db-deps
    volumes:
      - ${IMAGES_HOST_DIR:-images}:/images
      - ${AVATARS_HOST_DIR:-avatars}:/avatars
      - /mnt/bignas/vault/XXX/gallery-dl:/mnt/bignas/vault/XXX/gallery-dl:ro
      - ./logs:/logs
      - ./:/onani
      - ${DEEPDANBOORU_MODEL_HOST_DIR:-./models/deepdanbooru}:/models/deepdanbooru:ro

  # ──────────────────────────────────────────────────────────
  # PRODUCTION: pre-built images from GHCR
  # ──────────────────────────────────────────────────────────

  app:
    profiles: [ "prod" ]
    image: ${REGISTRY:-ghcr.io/onani-dev/onani}-app:${VERSION:-latest}
    restart: unless-stopped
    ports:
      # Caddy inside the container now binds :8080 (unprivileged), not :80 —
      # see Dockerfile/entrypoints/entrypoint.sh (non-root USER).
      - ${PORT:-80}:8080
    environment: *prod-env
    depends_on: *db-deps
    volumes:
      - ${IMAGES_HOST_DIR:-images}:/images
      - ${AVATARS_HOST_DIR:-avatars}:/avatars
      - ./migrations:/onani/migrations
    healthcheck:
      test: [ "CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3)" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  celery:
    profiles: [ "prod" ]
    image: ${REGISTRY:-ghcr.io/onani-dev/onani}-celery:${VERSION:-latest}
    restart: unless-stopped
    environment: *prod-env
    depends_on: *db-deps
    volumes:
      - ${IMAGES_HOST_DIR:-images}:/images
      - ${AVATARS_HOST_DIR:-avatars}:/avatars
      - ./migrations:/onani/migrations
    healthcheck:
      test: [ "CMD", "celery", "--app", "celery_worker.celery", "inspect", "ping", "-t", "5" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  app-ml:
    profiles: [ "prod-ml" ]
    image: ${REGISTRY:-ghcr.io/onani-dev/onani}-app-ml:${VERSION:-latest}
    restart: unless-stopped
    ports:
      - ${PORT:-80}:8080
    environment:
      <<: [*prod-env, *prod-env-ml]
    depends_on: *db-deps
    volumes:
      - ${IMAGES_HOST_DIR:-images}:/images
      - ${AVATARS_HOST_DIR:-avatars}:/avatars
      - ./migrations:/onani/migrations
      - ${DEEPDANBOORU_MODEL_HOST_DIR:-./models/deepdanbooru}:/models/deepdanbooru:ro
    healthcheck:
      test: [ "CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3)" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  celery-ml:
    profiles: [ "prod-ml" ]
    image: ${REGISTRY:-ghcr.io/onani-dev/onani}-celery-ml:${VERSION:-latest}
    restart: unless-stopped
    environment:
      <<: [*prod-env, *prod-env-ml]
    depends_on: *db-deps
    volumes:
      - ${IMAGES_HOST_DIR:-images}:/images
      - ${AVATARS_HOST_DIR:-avatars}:/avatars
      - ./migrations:/onani/migrations
      - ${DEEPDANBOORU_MODEL_HOST_DIR:-./models/deepdanbooru}:/models/deepdanbooru:ro
    healthcheck:
      test: [ "CMD", "celery", "--app", "celery_worker.celery", "inspect", "ping", "-t", "5" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ──────────────────────────────────────────────────────────
  # SHARED: Postgres + Redis (both dev and prod)
  # ──────────────────────────────────────────────────────────

  postgres:
    image: postgres:14-alpine
    restart: unless-stopped
    ports:
      # Loopback-only — was published on all interfaces (0.0.0.0:5432),
      # reachable from the whole LAN/host network with just DB_PASSWORD as
      # the barrier. Still reachable from `app`/`celery` over the compose
      # network either way; this only affects host access.
      - 127.0.0.1:5432:5432
    volumes:
      - ${DATABASE_HOST_DIR:-database}:/var/lib/postgresql/data/
    environment:
      PGUSER: onani_db
      POSTGRES_USER: onani_db
      POSTGRES_PASSWORD: ${DB_PASSWORD:?}
      POSTGRES_DB: onani_db
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U onani_db -d onani_db -h 127.0.0.1 -p 5432" ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.0.0-alpine
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli ping | grep PONG" ]
      interval: 1s
      timeout: 3s
      retries: 5

volumes:
  database:
  images:
  avatars:
  logs:
  frontend_node_modules:
